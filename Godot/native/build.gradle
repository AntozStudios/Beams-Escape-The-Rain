plugins {
    id 'com.android.library' version '8.11.1'
}

android {
    namespace 'com.antoz.beams'
    compileSdk 36
    defaultConfig {
        minSdk 34
        consumerProguardFiles 'proguard.txt'
    }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['.']
        java.exclude 'build/**'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'com.google.android.gms:play-services-ads:25.0.0'
    compileOnly 'com.google.android.ump:user-messaging-platform:4.0.0'
}

tasks.register('installBridge', Copy) {
    dependsOn 'assembleRelease'
    from layout.buildDirectory.file('outputs/aar/beams-release.aar')
    into '../addons/beams_android'
    rename { 'beams.aar' }
}
